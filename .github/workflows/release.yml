name: Release

# タグ（v1.2.3 形式）を push すると PaperOverlay.app をビルドして
# zip をリリースに添付します。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build .app, .dmg, .zip
        working-directory: macos/PaperOverlay
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash build-app.sh "$VERSION"
          bash make-dmg.sh "$VERSION"
          ditto -c -k --keepParent PaperOverlay.app PaperOverlay.app.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          # 安定したファイル名にして Pages の「最新DL」リンクを固定できるようにする
          files: |
            macos/PaperOverlay/PaperOverlay.dmg
            macos/PaperOverlay/PaperOverlay.app.zip
          generate_release_notes: true
          body: |
            ## PaperOverlay ${{ github.ref_name }}

            **DMG（推奨）:** `PaperOverlay.dmg` を開き、`PaperOverlay.app` を `Applications` にドラッグ。
            **zip:** `PaperOverlay.app.zip` を解凍して `~/Applications` へ。

            > 未公証のため初回は Finder で右クリック →「開く」で許可してください。
            > npm でも入ります: `npm i -g paperlike-overlay && paper-overlay start`
